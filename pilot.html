<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Field Strategy Studio · Pilot</title>
<style>
:root{
  --bg:#FFFFFF; --panel:#F0EFEA; --panel-2:#F8F7F4; --ink:#4F4A4A; --ink-strong:#2F2B2B; --ink-soft:#6A6464;
  --line:#DDDAD2; --brand:#BE2BBB; --brand-ink:#A3209F; --brand-soft:#F6E3F5; --on-brand:#FFFFFF;
  --indigo:#3312AF; --lindigo:#496FE3; --mg:#ADA599;
  --b0:#EFEDE7; --b1:#EBD3EA; --b2:#DDA9DB; --b3:#CF7CCC; --tile-ink:#2B2727;
  --good:#3312AF; --font:"Trebuchet MS","Segoe UI",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1C1919; --panel:#2A2626; --panel-2:#242020; --ink:#EDE9E4; --ink-strong:#FFFFFF; --ink-soft:#B9B2AB;
    --line:#403B3B; --brand:#D060CD; --brand-ink:#E58FE2; --brand-soft:#3A2539; --on-brand:#1C1919;
    --indigo:#B3A7FF; --lindigo:#8DA6F3; --mg:#8A8378;
    --b0:#2E2A2A; --b1:#4B2E4A; --b2:#6C3A6A; --b3:#8E4B8B; --tile-ink:#F5F1F1; --good:#B3A7FF; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1C1919; --panel:#2A2626; --panel-2:#242020; --ink:#EDE9E4; --ink-strong:#FFFFFF; --ink-soft:#B9B2AB;
  --line:#403B3B; --brand:#D060CD; --brand-ink:#E58FE2; --brand-soft:#3A2539; --on-brand:#1C1919;
  --indigo:#B3A7FF; --lindigo:#8DA6F3; --mg:#8A8378;
  --b0:#2E2A2A; --b1:#4B2E4A; --b2:#6C3A6A; --b3:#8E4B8B; --tile-ink:#F5F1F1; --good:#B3A7FF; color-scheme:dark;
}
*{box-sizing:border-box}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--indigo);outline-offset:2px;border-radius:6px}
#app{display:grid;grid-template-columns:240px minmax(0,1fr);grid-template-rows:minmax(0,1fr);height:100%;overflow:hidden}
.side{border-right:1px solid var(--line);padding:22px 14px;overflow:auto;display:flex;flex-direction:column;gap:6px;background:var(--bg)}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 18px;font-weight:700;font-size:17px;line-height:1.2;color:var(--ink-strong)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;border-radius:10px;padding:10px 10px;color:var(--ink)}
.nav button:hover{background:var(--panel)}
.nav button[aria-current="page"]{background:var(--brand-soft);color:var(--ink-strong);font-weight:700}
.nav svg{flex:none;width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-current="page"] svg{stroke:var(--brand-ink)}
.nav small{display:block;font-size:12px;color:var(--ink-soft);font-weight:400;line-height:1.25}
.side-foot{margin-top:auto;padding:14px 10px 4px;font-size:12.5px;color:var(--ink-soft);line-height:1.45}
.mcol{display:flex;flex-direction:column;min-width:0;min-height:0;height:100%;overflow:hidden}
.main{flex:1;overflow:auto;padding:26px 32px 56px;min-width:0}
.ph{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:flex-end;justify-content:space-between;margin-bottom:22px}
.ph h1{margin:0;font-size:28px;line-height:1.15;color:var(--ink-strong);font-weight:700}
.ph p{margin:6px 0 0;color:var(--ink-soft);max-width:68ch}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;background:var(--panel);font-size:12.5px;color:var(--ink);white-space:nowrap}
.pill.brand{background:var(--brand-soft);color:var(--ink-strong)}
.pill.line{background:none;border:1px solid var(--brand);color:var(--ink)}
h2{font-size:18px;margin:0 0 4px;color:var(--ink-strong)}
h3{font-size:15px;margin:0 0 6px;color:var(--ink-strong)}
.sub{color:var(--ink-soft);font-size:13.5px;margin:0 0 12px}
.card{background:var(--panel-2);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.card.flat{background:var(--panel);border-color:transparent}
.btn{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 14px;font-weight:700;color:var(--ink-strong)}
.btn:hover{border-color:var(--brand)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.primary:hover{filter:brightness(.94)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.seg{display:inline-flex;background:var(--panel);border-radius:11px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 14px;border-radius:8px;font-weight:700;color:var(--ink-soft)}
.seg button[aria-pressed="true"]{background:var(--bg);color:var(--ink-strong);box-shadow:0 1px 2px rgba(0,0,0,.14)}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:12px}
.k{background:var(--panel);border-radius:12px;padding:13px 15px;min-width:0}
.k .l{font-size:13px;color:var(--ink-soft)}
.k .v{font-size:26px;font-weight:700;color:var(--ink-strong);line-height:1.2;margin:2px 0;font-variant-numeric:tabular-nums}
.k .d{font-size:13px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.k .d.up{color:var(--good);font-weight:700}
.k .d.down{color:var(--ink-strong);font-weight:700}
.tour{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:12px}
.tour button{text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;line-height:1.35}
.tour button:hover{border-color:var(--brand)}
.tour b{display:block;color:var(--ink-strong);margin-bottom:2px}
.tour span{font-size:13.5px;color:var(--ink-soft)}
.bars{display:flex;flex-direction:column;gap:8px}
.brow{display:grid;grid-template-columns:110px 1fr 48px;gap:10px;align-items:center;width:100%;background:none;border:0;padding:5px 8px;border-radius:9px;text-align:left}
.brow:hover{background:var(--panel)}
.brow[aria-pressed="true"]{background:var(--brand-soft)}
.track{height:12px;border-radius:99px;background:var(--panel);overflow:hidden}
.brow[aria-pressed="true"] .track{background:var(--bg)}
.fill{height:100%;border-radius:99px;background:var(--brand);transition:width .3s}
.fill.alt{background:var(--lindigo)}
.fill.gray{background:var(--mg)}
.num{font-variant-numeric:tabular-nums;text-align:right;font-weight:700;color:var(--ink-strong)}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-weight:700;text-align:left;color:var(--ink-soft);font-size:13px;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--panel)}
tr.sel td{background:var(--brand-soft)}
.scroll-x{overflow-x:auto}
.ins{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.ins:last-child{border-bottom:0}
.ins .dot{flex:none;width:34px;height:34px;border-radius:10px;background:var(--brand-soft);display:grid;place-items:center}
.ins .dot svg{width:18px;height:18px;stroke:var(--brand-ink);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ins p{margin:2px 0 8px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.lab{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:22px;align-items:start}
.mapwrap{background:var(--panel-2);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.maptop{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}
svg.map{width:100%;height:auto;display:block}
.tile{cursor:pointer;outline:none}
.tile rect{fill:var(--b1);stroke:transparent;stroke-width:2;transition:fill .25s}
.tile.b0 rect{fill:var(--b0);stroke:var(--indigo);stroke-width:1.6;stroke-dasharray:4 3}
.tile.b1 rect{fill:var(--b1)}.tile.b2 rect{fill:var(--b2)}.tile.b3 rect{fill:var(--b3)}
.tile.chg rect{stroke:var(--indigo);stroke-width:3.2;stroke-dasharray:none}
.tile.sel rect{stroke:var(--ink-strong);stroke-width:3.2;stroke-dasharray:none}
.tile:focus-visible rect{stroke:var(--ink-strong);stroke-width:3.2}
.tile text{fill:var(--tile-ink);text-anchor:middle;pointer-events:none}
.tile .ab{font-size:15px;font-weight:700}
.tile .rp{font-size:12.5px}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--ink-soft);margin-top:8px}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:6px;background:var(--b1)}
.legend i.b0{background:var(--b0);border:1.5px dashed var(--indigo)}.legend i.b2{background:var(--b2)}.legend i.b3{background:var(--b3)}
.legend i.c{background:none;border:3px solid var(--indigo)}
.ctl{display:flex;flex-direction:column;gap:16px}
.ctl label{display:block;font-weight:700;color:var(--ink-strong);font-size:14px}
.ctl .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ctl output{font-variant-numeric:tabular-nums;color:var(--brand-ink);font-weight:700}
.ctl small{display:block;color:var(--ink-soft);font-size:12.5px;line-height:1.35;margin-top:2px}
input[type=range]{width:100%;accent-color:var(--brand);margin:6px 0 0}
select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--bg);margin-top:6px}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sw input{appearance:none;width:44px;height:26px;border-radius:99px;background:var(--mg);position:relative;cursor:pointer;flex:none;transition:background .2s;margin:0}
.sw input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s}
.sw input:checked{background:var(--brand)}
.sw input:checked::after{transform:translateX(18px)}
.say{margin:16px 0 4px;padding:14px 16px;border-radius:12px;background:var(--brand-soft);color:var(--ink-strong)}
.say p{margin:0 0 6px}.say p:last-child{margin:0}
.det dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:8px 0 0;font-size:14px}
.det dt{color:var(--ink-soft)}.det dd{margin:0;font-weight:700;color:var(--ink-strong);text-align:right;font-variant-numeric:tabular-nums}
.chat{display:flex;flex-direction:column;gap:14px;max-width:820px}
.msg{max-width:92%}
.msg.u{align-self:flex-end;background:var(--ink-strong);color:var(--bg);padding:10px 14px;border-radius:14px 14px 4px 14px}
.msg.a{align-self:flex-start;background:var(--panel-2);border:1px solid var(--line);padding:14px 16px;border-radius:14px 14px 14px 4px}
.msg .line{display:grid;grid-template-columns:160px 1fr;gap:10px;padding:5px 0}
.msg .ag{font-weight:700;color:var(--indigo)}
.msg p{margin:0 0 6px}
.askbar{display:flex;gap:10px;margin-top:6px;max-width:820px}
.askbar input{flex:1;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0;max-width:820px}
.chips button{background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:7px 13px;font-size:13.5px}
.chips button:hover{border-color:var(--brand)}
.tabs{display:flex;gap:4px;margin-bottom:20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs button{background:none;border:0;padding:10px 16px;font-weight:700;color:var(--ink-soft);border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink-strong);border-bottom-color:var(--brand)}
.cvs{width:100%;height:auto;display:block}
.cvs text{fill:var(--ink-soft);font-size:12px;font-family:var(--font)}
.cvs .gl{stroke:var(--line);stroke-width:1}
.cvs .ax{stroke:var(--mg);stroke-width:1}
.cvs .ln{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.cvs .lb{fill:var(--ink-strong);font-weight:700}
.key{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--ink-soft);margin-top:6px}
.key i{display:inline-block;width:22px;height:4px;border-radius:2px;vertical-align:middle;margin-right:6px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0}
.steps li{display:grid;grid-template-columns:34px 1fr;gap:12px;padding-bottom:16px;position:relative}
.steps li::before{content:"";position:absolute;left:16px;top:34px;bottom:2px;width:2px;background:var(--line)}
.steps li:last-child::before{display:none}
.steps .n{width:34px;height:34px;border-radius:50%;background:var(--brand-soft);display:grid;place-items:center;font-weight:700;color:var(--ink-strong)}
.steps .n.res{background:var(--brand);color:var(--on-brand)}
.steps b{color:var(--ink-strong)}
.opt{display:block;width:100%;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;line-height:1.35}
.opt[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft)}
.opt b{display:block;color:var(--ink-strong)}
.opt span{font-size:13.5px;color:var(--ink-soft)}
.flow{display:flex;align-items:stretch;gap:0;flex-wrap:wrap}
.node{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-weight:700;color:var(--ink-strong);display:flex;flex-direction:column;justify-content:center;min-width:0}
.node small{font-weight:400;color:var(--ink-soft);font-size:12.5px;line-height:1.3}
.node.on{border-color:var(--brand);background:var(--brand-soft)}
.node.bold{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.node.bold small{color:var(--on-brand)}
.arr{align-self:center;width:24px;text-align:center;color:var(--mg);font-size:20px;flex:none}
.lane{display:flex;align-items:center;gap:0;flex-wrap:wrap;margin:8px 0}
.lanelab{font-size:13px;color:var(--ink-soft);margin:10px 0 0}
.tag{display:inline-block;font-size:12px;font-weight:700;border-radius:99px;padding:2px 9px;margin-left:6px;vertical-align:1px}
.tag.re{background:var(--panel);color:var(--ink-strong)}
.tag.ne{background:none;border:1px solid var(--brand);color:var(--ink-strong)}
.tag.ip{background:var(--brand-soft);color:var(--ink-strong)}
.layers{display:flex;flex-direction:column;gap:8px}
.layer{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
.layer[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft)}
.layer b{color:var(--ink-strong);min-width:150px}
.phases{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.ph1{background:var(--panel);border-radius:12px;padding:14px 16px}
.ph1.now{background:var(--brand-soft);outline:2px solid var(--brand)}
.ph1 b{display:block;color:var(--ink-strong)}
.ph1 .dt{font-size:13px;color:var(--ink-soft);margin-bottom:6px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink-strong);color:var(--bg);padding:12px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:20;max-width:92vw;font-weight:700}
.toast.on{opacity:1;transform:translate(-50%,0)}
details{margin-top:14px;font-size:13.5px;color:var(--ink-soft)}
summary{cursor:pointer;font-weight:700;color:var(--ink-strong)}
details ul{margin:8px 0 0;padding-left:18px}
.mt{margin-top:18px}.mb{margin-bottom:18px}
@media (min-width:1101px){.lane,.flow{flex-wrap:nowrap}}
@media (max-width:1100px){.lab{grid-template-columns:minmax(0,1fr)}.kgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.g4,.tour,.phases{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:1fr}}
@media (max-width:860px){
  #app{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
  .side{flex-direction:row;align-items:center;border-right:0;border-bottom:1px solid var(--line);padding:8px 10px;overflow-x:auto;gap:4px}
  .brand{padding:0 8px 0 4px;white-space:nowrap;font-size:15px}
  .nav{flex-direction:row}.nav button{white-space:nowrap;padding:8px 10px}.nav small,.side-foot{display:none}
  .main{padding:20px 16px 48px}
  .grid,.g2,.g4,.tour,.phases{grid-template-columns:minmax(0,1fr) !important}
  .card{padding:16px}.node{min-width:0}
  .msg .line{grid-template-columns:1fr;gap:0}
}
@media (max-width:520px){.kgrid{grid-template-columns:1fr 1fr}.k .v{font-size:22px}.brow{grid-template-columns:96px 1fr 44px}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;scroll-behavior:auto!important}}

.brand small{display:inline-block;margin-left:4px;font-size:11px;font-weight:700;background:var(--brand-soft);padding:1px 7px;border-radius:99px;color:var(--ink-strong);vertical-align:2px}
.top{flex:none;display:flex;flex-wrap:wrap;gap:8px 22px;align-items:center;padding:10px 32px;border-bottom:1px solid var(--line);background:var(--bg);position:relative;z-index:12}
.tg{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tl{font-size:13px;color:var(--ink-soft)}
.top select{width:auto;max-width:300px;margin:0;padding:6px 10px}
.search{position:relative;margin-left:auto}
.search input{width:230px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.sres{position:absolute;right:0;top:calc(100% + 6px);width:340px;max-height:360px;overflow:auto;background:var(--bg);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 30px rgba(0,0,0,.18);padding:6px;z-index:25}
.sr{display:flex;flex-direction:column;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:8px 10px;gap:0}
.sr:hover{background:var(--panel)}.sr span{font-size:12.5px;color:var(--ink-soft)}
.ctxpill{display:flex;gap:6px;flex-wrap:wrap}
.kgrid.k6{grid-template-columns:repeat(6,minmax(0,1fr))}.kgrid.k3{grid-template-columns:repeat(3,minmax(0,1fr))}
.k .v{font-size:23px}.k .v a{color:inherit}
.bd{display:inline-block;font-size:12.5px;font-weight:700;border-radius:99px;padding:2px 10px;background:var(--panel);color:var(--ink-strong);white-space:nowrap}
.bd.warn{background:var(--brand-soft)}.bd.info{background:none;border:1px solid var(--brand)}.bd.bad{background:var(--ink-strong);color:var(--bg)}
.tbl .tbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.tsearch,.ti{padding:7px 11px;border:1px solid var(--line);border-radius:9px;background:var(--bg);min-width:220px}
.ti{width:100%;min-width:0}.ta{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--bg);resize:vertical}
.th{background:none;border:0;padding:0;font-weight:700;color:var(--ink-soft);font-size:13px;white-space:nowrap}.th:hover{color:var(--ink-strong)}
.pager{display:flex;align-items:center;gap:12px;justify-content:flex-end;margin-top:10px;font-size:13.5px;color:var(--ink-soft)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.lk{color:var(--indigo);font-weight:700;text-decoration:none}.lk:hover{text-decoration:underline}
.lbl{display:block;font-weight:700;font-size:13.5px;color:var(--ink-strong);margin-bottom:2px}.lbl output{color:var(--brand-ink);float:right}
.heat th{white-space:nowrap}.heat td{border-radius:0}
.segmat{display:grid;grid-template-columns:130px repeat(3,minmax(0,1fr));gap:10px;align-items:stretch}
.seghd{font-weight:700;color:var(--ink-soft);font-size:13.5px;display:flex;align-items:flex-end;padding:0 4px}.seghd.side{align-items:center}

<script>
// ======================= SYNTHETIC DATA ENGINE (all values are dummy) =======================
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const RND = mulberry32(20261119);
const rnd = (a = 0, b = 1) => a + (b - a) * RND();
const rint = (a, b) => Math.floor(rnd(a, b + 1));
const pick = a => a[Math.floor(RND() * a.length)];
const wpick = (items, w) => { let t = w.reduce((x, y) => x + y, 0), r = RND() * t; for (let i = 0; i < items.length; i++){ r -= w[i]; if (r <= 0) return items[i]; } return items[items.length - 1]; };
function gauss(){ let u = 0, v = 0; while (!u) u = RND(); while (!v) v = RND(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }
function pois(l){ if (l <= 0) return 0; if (l > 30) return Math.max(0, Math.round(l + Math.sqrt(l) * gauss())); const L = Math.exp(-l); let k = 0, p = 1; do { k++; p *= RND(); } while (p > L); return k - 1; }
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

// ---- time: month index 0 = Nov 2024 ... 23 = Oct 2026 (24 = Nov 2026 partial, call log only)
const NM = 24;
const MABR = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const mCal = i => (10 + i) % 12, mYear = i => 2024 + Math.floor((10 + i) / 12);
const mLabel = i => MABR[mCal(i)] + " ’" + String(mYear(i)).slice(2);
const QLAB = ["Q1 2026", "Q2 2026", "Q3 2026", "Q4 2026"];
const QR = [[14, 16], [17, 19], [20, 22], [23, 25]];
const PERIODS = {
  q3: { label: "Q3 2026", from: 20, to: 22 }, l3m: { label: "Last 3 months", from: 21, to: 23 },
  qtd: { label: "Q4 to date (Oct)", from: 23, to: 23 }, ytd: { label: "2026 year to date", from: 14, to: 23 }, l12m: { label: "Last 12 months", from: 12, to: 23 }
};
const TODAY = new Date(2026, 10, 19);

// ---- brands (dummy)
const BR = [
  { id: "A", name: "Brand A", area: "Oncology", price: 9200, g: 0.12, msgs: ["Efficacy in later lines", "Safety and tolerability", "Access and patient support"] },
  { id: "B", name: "Brand B", area: "Hematology", price: 5400, g: 0.08, msgs: ["Durable response", "Dosing convenience", "Access and patient support"] },
  { id: "C", name: "Brand C", area: "Cardiovascular", price: 380, g: 0.05, msgs: ["Outcomes evidence", "Once-daily simplicity", "Coverage and copay support"] }
];
const FORM = ["Preferred", "Covered", "Restricted", "Non-formulary"];
const FORM_MULT = [1.15, 1.0, 0.8, 0.55];
const SEGN = [["Defend and grow", "Grow", "Convert"], ["Maintain", "Develop", "Opportunistic"], ["Digital only", "Digital only", "Digital only"]];
const SEG_DEF = [[2.0, 2.0, 1.5], [1.0, 1.0, 0.5], [0.25, 0.25, 0.25]]; // planned calls per month by [potential tier][adoption tier]

// ---- geography
const REG = ["Northeast", "Southeast", "Midwest", "South Central", "West"];
const RS = { "Northeast": "NE", "Southeast": "SE", "Midwest": "MW", "South Central": "SC", "West": "W" };
const RAW = `AK|Alaska|West|0|0|1
ME|Maine|Northeast|11|0|2
VT|Vermont|Northeast|10|1|1
NH|New Hampshire|Northeast|11|1|2
WA|Washington|West|0|2|5
ID|Idaho|West|1|2|2
MT|Montana|West|2|2|1
ND|North Dakota|Midwest|3|2|1
MN|Minnesota|Midwest|4|2|4
WI|Wisconsin|Midwest|5|2|5
MI|Michigan|Midwest|7|2|6
NY|New York|Northeast|9|2|11
MA|Massachusetts|Northeast|10|2|5
RI|Rhode Island|Northeast|11|2|1
OR|Oregon|West|0|3|3
NV|Nevada|West|1|3|3
WY|Wyoming|West|2|3|1
SD|South Dakota|Midwest|3|3|1
IA|Iowa|Midwest|4|3|3
IL|Illinois|Midwest|5|3|8
IN|Indiana|Midwest|6|3|5
OH|Ohio|Midwest|7|3|7
PA|Pennsylvania|Northeast|8|3|8
NJ|New Jersey|Northeast|9|3|6
CT|Connecticut|Northeast|10|3|3
CA|California|West|0|4|14
UT|Utah|West|1|4|3
CO|Colorado|West|2|4|4
NE|Nebraska|Midwest|3|4|2
MO|Missouri|Midwest|4|4|5
KY|Kentucky|Southeast|5|4|4
WV|West Virginia|Southeast|6|4|2
VA|Virginia|Southeast|7|4|6
MD|Maryland|Southeast|8|4|5
DE|Delaware|Southeast|9|4|1
AZ|Arizona|West|1|5|5
NM|New Mexico|South Central|2|5|2
KS|Kansas|Midwest|3|5|2
AR|Arkansas|South Central|4|5|3
TN|Tennessee|Southeast|5|5|5
NC|North Carolina|Southeast|6|5|7
SC|South Carolina|Southeast|7|5|4
DC|District of Columbia|Southeast|8|5|1
OK|Oklahoma|South Central|3|6|3
LA|Louisiana|South Central|4|6|4
MS|Mississippi|Southeast|5|6|3
AL|Alabama|Southeast|6|6|4
GA|Georgia|Southeast|7|6|7
HI|Hawaii|West|0|7|2
TX|Texas|South Central|3|7|13
FL|Florida|Southeast|7|7|12`;
const STATES = RAW.split("\n").map(r => { const [a, n, rg, c, rw, p] = r.split("|"); return { a, n, rg, c: +c, r: +rw, pot: +p }; });
const SIDX = Object.fromEntries(STATES.map((s, i) => [s.a, i]));

const FN = ["Aisha","Ben","Carla","Daniel","Elena","Farid","Grace","Hiro","Ines","Jamal","Katya","Liam","Maya","Noah","Olga","Priya","Quinn","Rafael","Sofia","Tomas","Uma","Victor","Wen","Ximena","Yusuf","Zara","Adrian","Bianca","Chen","Dmitri","Esther","Felix","Gita","Hector","Irene","Jonas","Kemal","Lucia","Marcus","Nadia","Omar","Paula","Ravi","Sana","Theo","Una","Vikram","Wanda","Yara","Zoltan"];
const LN = ["Abbott","Bianchi","Castillo","Dubois","Eriksen","Fontaine","Garcia","Haddad","Ivanov","Jensen","Khan","Lindqvist","Moreau","Nakamura","Okafor","Petrov","Quintero","Rossi","Santos","Tanaka","Underhill","Varga","Whitfield","Xu","Yilmaz","Zimmerman","Alvarez","Brennan","Chowdhury","Delgado","Everett","Fischer","Gomez","Hartmann","Ito","Jaramillo","Kowalski","Larsen","Mehta","Novak","Osei","Prescott","Rahman","Sandoval","Thorne","Usman","Vasquez","Weiss","Yamamoto","Zhao"];
const ANAME = ["Riverbend","Lakeside","Summit","Cedar","Harbor","Maple","Northgate","Valley","Pinecrest","Westfield","Oakridge","Bayview","Sterling","Heritage","Meadow","Granite","Beacon","Crescent","Fairview","Ironwood"];
const ATYPES = [
  { t: "Academic medical center", suf: "University Medical Center", w: 8, beds: [500, 1200], hosp: true },
  { t: "Community hospital", suf: "Community Hospital", w: 26, beds: [120, 450], hosp: true },
  { t: "Specialty center", suf: "Specialty Center", w: 28, beds: [0, 0], hosp: false },
  { t: "Private practice group", suf: "Medical Group", w: 38, beds: [0, 0], hosp: false }
];
const SPECS = [
  { s: "Medical Oncology", w: 20, br: [0] }, { s: "Hematology/Oncology", w: 15, br: [0, 1] }, { s: "Hematology", w: 12, br: [1] },
  { s: "Cardiology", w: 28, br: [2] }, { s: "Internal Medicine", w: 20, br: [2] }, { s: "Nurse Practitioner", w: 5, br: [2] }
];
const HCP_TYPE_NAME = () => FN[Math.floor(RND() * FN.length)] + " " + LN[Math.floor(RND() * LN.length)];

// ---- territories, districts, reps
const TERR = [], DIST = [];
const REGDIR = ["Mina Okoye", "Peter Lindgren", "Samira Haddad", "Rodrigo Pena", "Hannah Whitcomb"];
STATES.forEach(s => {
  const n = Math.max(1, Math.round(s.pot * 0.42));
  for (let k = 1; k <= n; k++) TERR.push({ i: TERR.length, id: s.a + "-" + String(k).padStart(2, "0"), st: s.a, region: s.rg, sc: s.c, sr: s.r, k });
});
REG.forEach(rg => {
  const ts = TERR.filter(t => t.region === rg).sort((a, b) => a.sc - b.sc || a.sr - b.sr || a.k - b.k);
  const nd = Math.max(2, Math.round(ts.length / 5.5));
  ts.forEach((t, j) => { t.dnum = Math.floor(j * nd / ts.length); });
  for (let d = 0; d < nd; d++){
    const D = { i: DIST.length, id: RS[rg] + "-D" + (d + 1), name: rg + " " + (d + 1), region: rg, terrs: [], mgr: pick(FN) + " " + pick(LN) };
    ts.filter(t => t.dnum === d).forEach(t => { t.di = D.i; D.terrs.push(t.i); });
    DIST.push(D);
  }
});
const NT = TERR.length;
TERR.forEach(t => {
  t.rep = pick(FN) + " " + pick(LN); t.tenure = +(rnd(0.5, 14)).toFixed(1);
  t.effort = clamp(1 + 0.16 * gauss(), 0.7, 1.25); t.disc = clamp(rnd(0.3, 1), 0.3, 1); t.skill = clamp(1 + 0.12 * gauss(), 0.75, 1.3);
  t.tm = clamp(1 + 0.12 * gauss(), 0.75, 1.3); t.gs = clamp(1 + 1.4 * gauss(), -1.4, 3.6); t.status = "active"; t.vac = null; t.cover = -1;
});
// vacancies: 6 territories vacant since months 19-22
const vacPool = TERR.map(t => t.i).sort(() => RND() - 0.5).slice(0, 6);
vacPool.forEach(i => { const t = TERR[i]; t.status = "vacant"; t.vac = rint(19, 22); t.rep = "Vacant"; t.tenure = 0; });

// ---- accounts
const ACC = [], IDN = [];
REG.forEach(rg => { for (let k = 0; k < 6; k++) IDN.push({ i: IDN.length, name: pick(ANAME) + " " + pick(["Health", "Care Network", "Health Partners", "Medical Alliance"]), region: rg }); });
TERR.forEach(t => {
  const n = rint(3, 6);
  for (let k = 0; k < n; k++){
    const ty = wpick(ATYPES, ATYPES.map(x => x.w));
    let nm = pick(ANAME) + " " + ty.suf;
    const A = { i: ACC.length, id: "AC" + String(10000 + ACC.length), name: nm, type: ty.t, hosp: ty.hosp, st: t.st, t: t.i, size: ty.hosp ? rint(ty.beds[0], ty.beds[1]) : rint(3, 25), idn: -1, tier: 3, key: false, kam: -1, ptb: -1, ptDays: null };
    if (ty.hosp && RND() < 0.55) A.idn = pick(IDN.filter(d => d.region === t.region)).i;
    A.form = BR.map(() => ty.hosp ? wpick([0, 1, 2, 3], [0.28, 0.4, 0.24, 0.08]) : wpick([1, 2], [0.7, 0.3]));
    A.s340b = ty.hosp && RND() < 0.35;
    if (ty.hosp && RND() < 0.45){ A.ptb = rint(0, 2); A.ptDays = rint(5, 150); }
    ACC.push(A);
  }
});
const KAMN = ["Elise Hartwell", "Marco Delacroix", "Tanvi Kapoor", "Jordan Fields", "Ngozi Adeyemi", "Lars Bergstrom", "Camila Duarte", "Dev Malhotra", "Ruth Calloway", "Arjun Venkat", "Isabel Ferreira", "Kwame Boateng"];

// ---- HCPs: pass 1 (latent attributes)
const HCP = [];
const MSEAS = [1.0, 1.04, 0.95, 0.97, 1.0, 1.02, 1.0, 0.96, 0.98, 1.03, 1.05, 1.0]; // by calendar month
TERR.forEach(t => {
  const accts = ACC.filter(a => a.t === t.i);
  const aw = accts.map(a => a.hosp ? 1 + a.size / 400 : 1);
  const n = rint(28, 44);
  for (let k = 0; k < n; k++){
    const sp = wpick(SPECS, SPECS.map(x => x.w));
    const ac = wpick(accts, aw);
    const h = { i: HCP.length, id: "H" + String(100000 + HCP.length), name: HCP_TYPE_NAME(), spec: sp.s, brands: sp.br.slice(), t: t.i, t2: -1, split: 1, acc: ac.i, acc2: -1,
      yrs: rint(3, 38), optin: RND() < 0.62, pref: wpick([0, 1, 2], [0.55, 0.3, 0.15]), lv: [], bs: [], dup: false };
    if (sp.s === "Hematology/Oncology" && RND() < 0.2) h.brands = [0];
    h.brands.forEach(b => {
      const mu = [1.8, 1.4, 3.1][b], sd = [0.8, 0.8, 0.7][b];
      h.lv[b] = Math.exp(mu + sd * gauss());
      h.bs[b] = clamp(0.04 + 0.55 * Math.pow(RND(), 1.6) * t.tm, 0.02, 0.75);
    });
    if (RND() < 0.07){ const sib = TERR.filter(x => x.di === t.di && x.i !== t.i); if (sib.length){ const t2 = pick(sib); h.t2 = t2.i; h.split = +(rnd(0.5, 0.7)).toFixed(2); const a2 = ACC.filter(a => a.t === t2.i); if (a2.length) h.acc2 = pick(a2).i; } }
    HCP.push(h);
  }
});
const N = HCP.length;
// latent percentiles per brand
const LATP = BR.map(() => new Float32Array(N).fill(-1));
BR.forEach((b, bi) => { const ids = HCP.filter(h => h.brands.includes(bi)).sort((x, y) => x.lv[bi] - y.lv[bi]); ids.forEach((h, j) => { LATP[bi][h.i] = j / ids.length; }); });
const tierP = p => p >= 0.7 ? 0 : p >= 0.4 ? 1 : 2;
const tierA = s => s >= 0.35 ? 0 : s >= 0.15 ? 1 : 2;
HCP.forEach(h => { h.plan0 = Math.max(...h.brands.map(b => SEG_DEF[tierP(LATP[b][h.i])][tierA(h.bs[b])])); });

// ---- series
const TRX = BR.map(() => new Float32Array(N * NM)), NBRX = BR.map(() => new Float32Array(N * NM)), MKT = BR.map(() => new Float32Array(N * NM));
const CALLS = new Uint8Array(N * NM), VCALLS = new Uint8Array(N * NM), EMAILS = new Uint8Array(N * NM);
const CALLLOG = [];
function isWeekday(y, m, d){ const w = new Date(y, m, d).getDay(); return w !== 0 && w !== 6; }
function genCalls(h, mIdx, cnt, partial){
  const cm = mCal(mIdx), yr = mYear(mIdx), maxd = partial ? 18 : new Date(yr, cm + 1, 0).getDate();
  const t = TERR[h.t];
  for (let c = 0; c < cnt; c++){
    let d, g = 0; do { d = rint(1, maxd); g++; } while (!isWeekday(yr, cm, d) && g < 20);
    const virt = RND() < (h.pref === 1 ? 0.55 : h.pref === 0 ? 0.18 : 0.3) + 0.006 * mIdx - 0.1;
    const lb = h.brands[0];
    const nmsg = rint(1, 3), ms = BR[lb].msgs.slice().sort(() => RND() - 0.5).slice(0, nmsg);
    const op = RND() * t.skill; const out = op > 0.95 ? 0 : op > 0.55 ? 1 : 2;
    CALLLOG.push({ i: CALLLOG.length, h: h.i, t: h.t, m: mIdx, d, ch: virt ? 1 : 0, dur: rint(6, 26), msgs: ms, out, br: lb });
  }
}
HCP.forEach(h => {
  const t = TERR[h.t], acc = ACC[h.acc];
  const hf = Math.exp(0.3 * gauss());
  const vol = h.brands.map(b => h.lv[b]);
  const cw = [0, 0, 0];
  for (let m = 0; m < NM + 1; m++){
    const season = MSEAS[mCal(m)];
    let eff = t.effort;
    if (t.vac !== null && m >= t.vac) eff = 0.06;
    let mean = h.plan0 * eff * season * hf + (h.plan0 < 0.5 ? 0.12 * (1 - t.disc) : 0);
    if (m === NM) mean *= 0.6;
    const cnt = Math.min(9, pois(mean));
    if (m < NM){
      CALLS[h.i * NM + m] = cnt;
      let vv = 0; for (let c = 0; c < cnt; c++) if (RND() < (h.pref === 1 ? 0.55 : h.pref === 0 ? 0.18 : 0.3) + 0.006 * m - 0.1) vv++;
      VCALLS[h.i * NM + m] = vv;
      EMAILS[h.i * NM + m] = h.optin ? pois(0.6 + (h.pref === 2 ? 0.8 : 0)) : 0;
    }
    if (m >= 18) genCalls(h, m, cnt, m === NM);
    if (m === NM) break;
    cw[m % 3] = cnt;
    const win = (CALLS[h.i * NM + m] + (m > 0 ? CALLS[h.i * NM + m - 1] : 0) + (m > 1 ? CALLS[h.i * NM + m - 2] : 0));
    h.brands.forEach((b, j) => {
      const g = BR[b].g;
      const mk = vol[j] * (1 + 0.006 * m) * season * (1 + 0.04 * gauss());
      const fm = acc.hosp ? FORM_MULT[acc.form[b]] : 1;
      const share = clamp(h.bs[b] * (1 + 0.02 * Math.min(9, win)) * fm * (1 + g * m / 12 * t.gs) * (0.97 + 0.06 * RND()), 0.005, 0.9);

function nba(t){

    if (od > 1){ sc += Math.min(25, 12 * od); why.push(last > 900 ? "No call recorded in 6 months" : "Overdue: " + last + " days since last call, plan is every " + Math.round(interval)); }
    if (p3 > 0 && (t3 - p3) / p3 < -0.2){ sc += 15; why.push("TRx down " + pc0(-(t3 - p3) / p3) + " versus prior 3 months"); }
    if (p3 > 0 && (t3 - p3) / p3 > 0.25){ sc += 8; why.push("TRx up " + pc0((t3 - p3) / p3) + ": reinforce"); }
